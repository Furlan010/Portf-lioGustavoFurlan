ill="#293b31" font-family="Georgia, serif" font-size="40" font-weight="400" >O sim</text><text x="276" y="755" fill="#293b31" font-family="Arial, sans-serif" font-size="23" font-weight="400" >O começo do nosso próximo capítulo.</text><path d="M72 820H1005" stroke="#c4bfaf"/><text x="75" y="868" fill="#293b31" font-family="Georgia, serif" font-size="43" font-weight="400" >18:00</text><text x="275" y="867" fill="#293b31" font-family="Georgia, serif" font-size="40" font-weight="400" >À mesa</text><text x="276" y="910" fill="#293b31" font-family="Arial, sans-serif" font-size="23" font-weight="400" >Sabores, brindes e boas histórias.</text><path d="M72 975H1005" stroke="#c4bfaf"/><text x="75" y="1023" fill="#293b31" font-family="Georgia, serif" font-size="43" font-weight="400" >20:00</text><text x="275" y="1022" fill="#293b31" font-family="Georgia, serif" font-size="40" font-weight="400" >A pista</text><text x="276" y="1065" fill="#293b31" font-family="Arial, sans-serif" font-size="23" font-weight="400" >A noite continua em boa companhia.</text><path d="M65 1240H1015" stroke="#293b31"/><text x="65" y="1284" fill="#293b31" font-family="Arial, sans-serif" font-size="17" font-weight="400" letter-spacing="2">PROGRAMAÇÃO / A MESMA VOZ EM CADA PEÇA</text><rect x="0" y="0" width="1080" height="1350" rx="0" fill="url(#grain)" /></svg>