<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img"><title>Cardápio Intervalo com quatro produtos e preços ilustrativos</title><defs><pattern id="grain" width="11" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".6" fill="#000" opacity=".06"/><circle cx="8" cy="10" r=".5" fill="#fff" opacity=".15"/></pattern><filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="9" dy="16" stdDeviation="14" flood-opacity=".17"/></filter></defs><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#f4eedc" /><text x="65" y="84" fill="#2b261f" font-family="Arial, sans-serif" font-size="20" font-weight="400" letter-spacing="3">INTERVALO. / CARDÁPIO</text><text x="65" y="245" fill="#2b261f" font-family="Georgia, serif" font-size="91" font-weight="400" >Peça. Sente.</text><text x="65" y="350" fill="#ec6337" font-family="Georgia, serif" font-size="111" font-weight="400" font-style="italic">Aproveite.</text><path d="M65 490H1015" stroke="#c9c1ab"/><text x="65" y="544" fill="#2b261f" font-family="Georgia, serif" font-size="43" font-weight="400" >Espresso</text><text x="65" y="590" fill="#2b261f" font-family="Arial, sans-serif" font-size="23" font-weight="400" >Curto, intenso e sem pressa.</text><text x="1015" y="545" fill="#ec6337" font-family="Arial, sans-serif" font-size="35" font-weight="400" text-anchor="end">R$ 8</text><path d="M65 645H1015" stroke="#c9c1ab"/><text x="65" y="699" fill="#2b261f" font-family="Georgia, serif" font-size="43" font-weight="400" >Cappuccino</text><text x="65" y="745" fill="#2b261f" font-family="Arial, sans-serif" font-size="23" font-weight="400" >Café, leite e uma boa espuma.</text><text x="1015" y="700" fill="#ec6337" font-family="Arial, sans-serif" font-size="35" font-weight="400" text-anchor="end">R$ 14</text><path d="M65 800H1015" stroke="#c9c1ab"/><text x="65" y="854" fill="#2b261f" font-family="Georgia, serif" font-size="43" font-weight="400" >Coado</text><text x="65" y="900" fill="#2b261f" font-family="Arial, sans-serif" font-size="23" font-weight="400" >O clássico que acolhe.</text><text x="1015" y="855" fill="#ec6337" font-family="Arial, sans-serif" font-size="35" font-weight="400" text-anchor="end">R$ 10</text><path d="M65 955H1015" stroke="#c9c1ab"/><text x="65" y="1009" fill="#2b261f" font-family="Georgia, serif" font-size="43" font-weight="400" >Cookie da casa</text><text x="65" y="1055" fill="#2b261f" font-family="Arial, sans-serif" font-size="23" font-weight="400" >Para acompanhar a conversa.</text><text x="1015" y="1010" fill="#ec6337" font-family="Arial, sans-serif" font-size="35" font-weight="400" text-anchor="end">R$ 9</text><path d="M65 1240H1015" stroke="#2b261f"/><text x="65" y="1284" fill="#2b261f" font-family="Arial, sans-serif" font-size="17" font-weight="400" letter-spacing="2">VALORES ILUSTRATIVOS / MARCA FICTÍCIA</text><rect x="0" y="0" width="1080" height="1350" rx="0" fill="url(#grain)" /></svg>