<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#194d39"/><text x="70" y="115" fill="#e7f0e4" font-size="29" font-family="Arial, sans-serif" font-weight="700" letter-spacing="3">CLUBE PET</text><text x="1010" y="115" fill="#b9cfb5" font-size="23" font-family="Arial, sans-serif" text-anchor="end">02 / 03</text><text x="70" y="320" fill="#f6f4e9" font-size="75" font-family="Arial, sans-serif" font-weight="700" letter-spacing="-3">O básico também</text><text x="70" y="415" fill="#f6f4e9" font-size="75" font-family="Arial, sans-serif" font-weight="700" letter-spacing="-3">é cuidado.</text><circle cx="111" cy="625" r="40" fill="#d5e2b6"/><text x="111" y="637" fill="#194d39" font-size="30" font-family="Arial, sans-serif" text-anchor="middle">1</text><text x="190" y="635" fill="#f6f4e9" font-size="36" font-family="Arial, sans-serif" >Água fresca por perto.</text><text x="190" y="695" fill="#b9cfb5" font-size="25" font-family="Arial, sans-serif" >Lave o recipiente e renove a água.</text><circle cx="111" cy="840" r="40" fill="#d5e2b6"/><text x="111" y="852" fill="#194d39" font-size="30" font-family="Arial, sans-serif" text-anchor="middle">2</text><text x="190" y="850" fill="#f6f4e9" font-size="36" font-family="Arial, sans-serif" >Tempo para brincar.</text><text x="190" y="910" fill="#b9cfb5" font-size="25" font-family="Arial, sans-serif" >Separe um momento de atenção todos os dias.</text><circle cx="111" cy="1055" r="40" fill="#d5e2b6"/><text x="111" y="1067" fill="#194d39" font-size="30" font-family="Arial, sans-serif" text-anchor="middle">3</text><text x="190" y="1065" fill="#f6f4e9" font-size="36" font-family="Arial, sans-serif" >Passeio com segurança.</text><text x="190" y="1125" fill="#b9cfb5" font-size="25" font-family="Arial, sans-serif" >Confira a guia e a identificação antes de sair.</text><text x="70" y="1270" fill="#d5e2b6" font-size="21" font-family="Arial, sans-serif" letter-spacing="3">SALVE PARA LEMBRAR DEPOIS.</text></svg>