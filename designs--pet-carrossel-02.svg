<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img"><title>Três cartões de cuidados cotidianos com cães</title><defs><pattern id="grain" width="11" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".6" fill="#000" opacity=".06"/><circle cx="8" cy="10" r=".5" fill="#fff" opacity=".15"/></pattern><filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="9" dy="16" stdDeviation="14" flood-opacity=".17"/></filter></defs><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#193e33" /><text x="65" y="84" fill="#dce97e" font-family="Arial, sans-serif" font-size="20" font-weight="400" letter-spacing="3">CLUBE PET / PEQUENOS HÁBITOS</text><text x="65" y="230" fill="#f0eee2" font-family="Arial, sans-serif" font-size="102" font-weight="700" >Todo dia</text><text x="65" y="342" fill="#dce97e" font-family="Arial, sans-serif" font-size="126" font-weight="700" >conta.</text><rect x="65" y="465" width="950" height="193" rx="20" fill="#294e41" /><text x="97" y="531" fill="#dce97e" font-family="Georgia, serif" font-size="43" font-weight="400" >01</text><text x="207" y="530" fill="#f0eee2" font-family="Arial, sans-serif" font-size="35" font-weight="700" >Água sempre por perto.</text><text x="207" y="582" fill="#dedfcd" font-family="Arial, sans-serif" font-size="24" font-weight="400" >Mantenha água fresca disponível.</text><rect x="65" y="689" width="950" height="193" rx="20" fill="#294e41" /><text x="97" y="755" fill="#dce97e" font-family="Georgia, serif" font-size="43" font-weight="400" >02</text><text x="207" y="754" fill="#f0eee2" font-family="Arial, sans-serif" font-size="35" font-weight="700" >Tempo de qualidade.</text><text x="207" y="806" fill="#dedfcd" font-family="Arial, sans-serif" font-size="24" font-weight="400" >Reserve momentos para brincar e passear.</text><rect x="65" y="913" width="950" height="193" rx="20" fill="#294e41" /><text x="97" y="979" fill="#dce97e" font-family="Georgia, serif" font-size="43" font-weight="400" >03</text><text x="207" y="978" fill="#f0eee2" font-family="Arial, sans-serif" font-size="35" font-weight="700" >Atenção aos sinais.</text><text x="207" y="1030" fill="#dedfcd" font-family="Arial, sans-serif" font-size="24" font-weight="400" >Mudanças de comportamento merecem cuidado.</text><text x="65" y="1205" fill="#dedfcd" font-family="Arial, sans-serif" font-size="23" font-weight="400" >Em caso de dúvida, procure um veterinário.</text><path d="M65 1240H1015" stroke="#dce97e"/><text x="65" y="1284" fill="#dce97e" font-family="Arial, sans-serif" font-size="17" font-weight="400" letter-spacing="2">ROTINA COM CARINHO / 02 DE 03</text><rect x="0" y="0" width="1080" height="1350" rx="0" fill="url(#grain)" /></svg>